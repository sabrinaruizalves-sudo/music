<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My girlhood songs ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#23022E;
  background-image:
    radial-gradient(ellipse at 20% 15%, #4a1020 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, #3d1808 0%, transparent 50%),
    radial-gradient(ellipse at 60% 40%, #2e0a1a 0%, transparent 60%),
    radial-gradient(ellipse at 10% 85%, #FF9B4218 0%, transparent 40%),
    radial-gradient(ellipse at 90% 10%, #AC156A18 0%, transparent 40%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'IM Fell English',serif;
  padding:24px 16px 40px;
  overflow-x:hidden;
}
.heart{position:fixed;pointer-events:none;z-index:0;opacity:0;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(-15deg);opacity:.8}
  60%{opacity:.6}
  100%{transform:translateY(110vh) rotate(25deg);opacity:0}
}
.title-area{text-align:center;margin-bottom:24px;position:relative;z-index:2}
.title-area h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(18px,3vw,28px);
  color:#F3F0E7;letter-spacing:.14em;
  text-shadow:0 0 40px #FF9B4244;
}
.title-area p{color:#c8a07888;font-size:12px;letter-spacing:.22em;margin-top:7px;font-style:italic}
.player-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.turntable{
  width:340px;height:340px;
  background:radial-gradient(circle at 38% 33%, #2e0e1c, #1a0510);
  border-radius:18px;
  border:1px solid #AC156A44;
  box-shadow:0 0 0 1px #FF9B4211, 0 12px 50px #00000088, 0 0 60px #AC156A18, inset 0 1px 0 #ffffff0a;
  position:relative;display:flex;align-items:center;justify-content:center;overflow:visible;
}
.turntable::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:7px;
  background:linear-gradient(90deg,#5a1a08,#8a2e10,#4e1206,#7a2810,#521408);
  border-radius:0 0 16px 16px;opacity:.8;
}
.felt{
  width:268px;height:268px;border-radius:50%;
  background:radial-gradient(circle at 45% 40%, #1e0810, #120408);
  position:absolute;
  box-shadow:0 2px 16px #00000066, inset 0 1px 4px #ffffff05;
}
.vinyl{width:252px;height:252px;border-radius:50%;position:absolute}
.vinyl svg{width:100%;height:100%;border-radius:50%}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.vinyl.playing{animation:spin 2.2s linear infinite}
.tonearm-wrap{
  position:absolute;top:12px;right:22px;
  width:120px;height:190px;
  transform-origin:18px 18px;cursor:pointer;
  transition:transform .9s cubic-bezier(.4,0,.2,1);
  z-index:10;transform:rotate(-30deg);
}
.tonearm-wrap.on-record{transform:rotate(0deg)}
.tonearm-base{
  position:absolute;top:0;left:0;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #c87040, #8a3818);
  border:1.5px solid #FF9B4266;
  box-shadow:0 2px 10px #FF9B4233;
}
.tonearm-arm{
  position:absolute;top:18px;left:18px;width:10px;height:160px;
  background:linear-gradient(90deg,#7a3010,#c86830,#7a3010);
  border-radius:5px 5px 2px 2px;transform-origin:5px 0px;
  transform:rotate(-5deg);box-shadow:1px 0 8px #00000044;
}
.tonearm-head{
  position:absolute;bottom:-8px;left:-7px;width:24px;height:16px;
  background:linear-gradient(135deg,#F53B4A,#8a1020);
  border-radius:3px 3px 8px 8px;border:1px solid #F53B4A55;
  box-shadow:0 0 8px #F53B4A33;
}
.hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  color:#c8807055;font-size:10px;letter-spacing:.15em;font-style:italic;
  white-space:nowrap;transition:opacity .5s;pointer-events:none;z-index:5;
}
.hint.hidden{opacity:0}
.info-panel{
  width:340px;margin-top:14px;
  background:#1e0812cc;
  border:1px solid #AC156A33;
  border-radius:14px;padding:14px 18px;
  backdrop-filter:blur(12px);
  box-shadow:0 4px 30px #00000055, 0 0 40px #AC156A11;
}
.now-playing{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#F53B4A;box-shadow:0 0 8px #F53B4A88;flex-shrink:0;transition:all .3s}
.dot.off{background:#4a1828;box-shadow:none}
.song-title{font-family:'Playfair Display',serif;font-size:15px;color:#F3F0E7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:11px;color:#c89070;letter-spacing:.15em;margin-top:2px}
.timeline-wrap{position:relative;margin-bottom:10px}
.timeline-bg{width:100%;height:3px;background:#3a0e1a;border-radius:2px;cursor:pointer;position:relative}
.timeline-fill{height:100%;background:linear-gradient(90deg,#AC151C,#F53B4A,#FF9B42);border-radius:2px;width:0%;pointer-events:none}
.timeline-thumb{width:11px;height:11px;border-radius:50%;background:#FF9B42;border:2px solid #23022E;position:absolute;top:50%;transform:translate(-50%,-50%);left:0%;pointer-events:none;box-shadow:0 0 6px #FF9B4288}
.time-row{display:flex;justify-content:space-between;margin-top:6px}
.time-txt{font-size:11px;color:#7a4838;letter-spacing:.1em}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px}
.ctrl-btn{background:none;border:none;cursor:pointer;color:#7a4040;font-size:22px;padding:6px;border-radius:50%;transition:color .2s,transform .15s;line-height:1}
.ctrl-btn:hover{color:#F3F0E7;transform:scale(1.15)}
.ctrl-btn.play-btn{
  width:44px;height:44px;
  border:1px solid #AC156A44;
  background:#2e0818;
  font-size:18px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  box-shadow:0 0 16px #AC156A22;
  color:#F3F0E7;
}
.ctrl-btn.play-btn:hover{background:#3e1028;border-color:#F53B4A88;box-shadow:0 0 20px #F53B4A33}
.song-list{width:340px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.song-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:10px;cursor:pointer;
  border:1px solid transparent;
  transition:background .2s,border-color .2s;
  color:#c89878;font-family:'IM Fell English',serif;
  background:#1e081288;
  backdrop-filter:blur(8px);
}
.song-item:hover{background:#2e1020aa;border-color:#AC156A33}
.song-item.active{background:#2e0c14bb;border-color:#F53B4A55;color:#F3F0E7}
.song-num{font-size:11px;width:16px;text-align:center;flex-shrink:0;opacity:.5}
.song-info{flex:1;min-width:0}
.s-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-artist{font-size:10px;opacity:.6;margin-top:1px;letter-spacing:.1em}
.s-dur{font-size:11px;opacity:.5;flex-shrink:0}
</style>
</head>
<body>

<div id="hearts"></div>

<div class="title-area">
  <h1>✦ My girlhood songs ✦</h1>
  <p>Place the needle upon the record</p>
</div>

<div class="player-wrap">
  <div class="turntable" id="turntable">
    <div class="felt"></div>
    <div class="vinyl" id="vinyl">
      <svg viewBox="0 0 252 252" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="vg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2a0c18"/>
            <stop offset="40%" stop-color="#1a0610"/>
            <stop offset="100%" stop-color="#0e0308"/>
          </radialGradient>
          <radialGradient id="lg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3a0e20"/>
            <stop offset="100%" stop-color="#23081a"/>
          </radialGradient>
        </defs>
        <circle cx="126" cy="126" r="126" fill="url(#vg)"/>
        <circle cx="126" cy="126" r="118" fill="none" stroke="#3a1020" stroke-width=".8"/>
        <circle cx="126" cy="126" r="110" fill="none" stroke="#2e0c18" stroke-width=".6"/>
        <circle cx="126" cy="126" r="102" fill="none" stroke="#3a1020" stroke-width=".8"/>
        <circle cx="126" cy="126" r="94"  fill="none" stroke="#2e0c18" stroke-width=".6"/>
        <circle cx="126" cy="126" r="86"  fill="none" stroke="#3a1020" stroke-width=".8"/>
        <circle cx="126" cy="126" r="78"  fill="none" stroke="#2e0c18" stroke-width=".6"/>
        <circle cx="126" cy="126" r="70"  fill="none" stroke="#3a1020" stroke-width=".8"/>
        <circle cx="126" cy="126" r="50"  fill="url(#lg)"/>
        <circle cx="126" cy="126" r="46"  fill="none" stroke="#AC156A" stroke-width=".9" opacity=".5"/>
        <circle cx="126" cy="126" r="38"  fill="#1e0814"/>
        <path d="M126,134 C126,134 113,124 113,116 C113,111 117.5,108.5 121.5,110 C123.5,110.8 126,113.5 126,113.5 C126,113.5 128.5,110.8 130.5,110 C134.5,108.5 139,111 139,116 C139,124 126,134 126,134 Z" fill="#F53B4A" opacity=".85"/>
        <path d="M104,113 C104,113 99,109 99,106 C99,103.5 100.8,102 103,102.5 C103.7,102.7 104,103.3 104,103.3 C104,103.3 104.3,102.7 105,102.5 C107.2,102 109,103.5 109,106 C109,109 104,113 104,113 Z" fill="#AC156A" opacity=".75"/>
        <path d="M148,113 C148,113 143,109 143,106 C143,103.5 144.8,102 147,102.5 C147.7,102.7 148,103.3 148,103.3 C148,103.3 148.3,102.7 149,102.5 C151.2,102 153,103.5 153,106 C153,109 148,113 148,113 Z" fill="#FF9B42" opacity=".7"/>
        <path d="M111,145 C111,145 107,142 107,139.5 C107,137.5 108.5,136.2 110.5,136.7 C111,136.9 111.3,137.4 111.3,137.4 C111.3,137.4 111.6,136.9 112.1,136.7 C114.1,136.2 115.6,137.5 115.6,139.5 C115.6,142 111,145 111,145 Z" fill="#AC151C" opacity=".7"/>
        <path d="M141,145 C141,145 137,142 137,139.5 C137,137.5 138.5,136.2 140.5,136.7 C141,136.9 141.3,137.4 141.3,137.4 C141.3,137.4 141.6,136.9 142.1,136.7 C144.1,136.2 145.6,137.5 145.6,139.5 C145.6,142 141,145 141,145 Z" fill="#F53B4A" opacity=".65"/>
        <text x="126" y="116" text-anchor="middle" font-family="'Playfair Display',serif" font-size="5.5" fill="#F3F0E7" letter-spacing="1.2" opacity=".8">HeartIt</text>
        <text x="126" y="124" text-anchor="middle" font-family="'Playfair Display',serif" font-size="4.5" fill="#F3F0E7" letter-spacing=".8" opacity=".7">RECORDS</text>
        <circle cx="126" cy="126" r="4.5" fill="#c86838"/>
        <circle cx="126" cy="126" r="2"   fill="#23022E"/>
      </svg>
    </div>
    <div class="tonearm-wrap" id="tonearm">
      <div class="tonearm-base"></div>
      <div class="tonearm-arm"><div class="tonearm-head"></div></div>
    </div>
    <div class="hint" id="hint">click arm or ▶ to play</div>
  </div>

  <div class="info-panel">
    <div class="now-playing">
      <div class="dot off" id="dot"></div>
      <div>
        <div class="song-title" id="song-title">— select a song —</div>
        <div class="song-artist" id="song-artist"></div>
      </div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-bg" id="timeline">
        <div class="timeline-fill" id="tl-fill"></div>
        <div class="timeline-thumb" id="tl-thumb"></div>
      </div>
      <div class="time-row">
        <span class="time-txt" id="t-cur">0:00</span>
        <span class="time-txt" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prev-btn">⏮</button>
      <button class="ctrl-btn play-btn" id="play-btn">▶</button>
      <button class="ctrl-btn" id="next-btn">⏭</button>
    </div>
  </div>

  <div class="song-list" id="song-list"></div>
</div>

<!--
  The hidden iframe uses youtube-nocookie.com with enablejsapi=1.
  We control it via postMessage — no YT.Player object needed,
  so it works in Electron / WebView / file:// with no origin restrictions.
-->
<iframe
  id="yt-frame"
  style="position:fixed;left:-9999px;top:0;width:2px;height:2px;border:0"
  allow="autoplay"
  allowfullscreen
></iframe>

<script>
/* ── Falling hearts ── */
(function(){
  const colors=['#F53B4A','#AC156A','#AC151C','#FF9B42','#c84050'];
  const c=document.getElementById('hearts');
  for(let i=0;i<32;i++){
    const col=colors[i%colors.length];
    const sz=8+Math.random()*16;
    const d=document.createElement('div');
    d.className='heart';
    d.innerHTML=`<svg width="${sz}" height="${sz}" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg"><path d="M10,16 C10,16 1,10 1,5 C1,2.2 3,0.5 5.5,1 C7,1.3 10,4 10,4 C10,4 13,1.3 14.5,1 C17,0.5 19,2.2 19,5 C19,10 10,16 10,16 Z" fill="${col}" opacity="${0.45+Math.random()*.45}"/></svg>`;
    d.style.cssText=`left:${Math.random()*100}vw;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*18}s;`;
    c.appendChild(d);
  }
})();

/* ── Songs ── */
const SONGS = [
  { title:"Oxygen",              artist:"Beach Bunny", videoId:"6-jZBtFcbtI", duration:186 },
  { title:"Francis Forever",     artist:"Mitski",      videoId:"mHKTdlUyyko", duration:149 },
  { title:"Moon Girl",           artist:"Ha Vay",      videoId:"Y6KQVbOhN04", duration:217 },
  { title:"Daughter (stripped)", artist:"L Devine",    videoId:"V06SbMGJtK0", duration:214 },
  { title:"Love Story",          artist:"Reinaeiry",   videoId:"vOz3W8TGSBE", duration:240 },
  // { title:"Song Title", artist:"Artist", videoId:"YOUTUBE_ID", duration:000 },
];

/* ── State ── */
let currentIdx=0, isPlaying=false, songLoaded=false, ticker=null;
let iframeReady=false, pendingAutoplay=false;
let currentTime=0, knownDuration=0;

function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60}

/* ── iframe reference ── */
const frame = document.getElementById('yt-frame');

/*
  postMessage command helper.
  YouTube's embed accepts these commands when enablejsapi=1:
  playVideo, pauseVideo, stopVideo, seekTo, mute, unMute
*/
function ytCmd(func, args){
  if(!frame || !frame.contentWindow) return;
  frame.contentWindow.postMessage(
    JSON.stringify({ event:'command', func, args: args || [] }),
    '*'
  );
}

/* Listen for state messages back from the YouTube iframe */
window.addEventListener('message', ev => {
  let d;
  try { d = JSON.parse(ev.data); } catch(e){ return; }

  if(d.event === 'onReady'){
    iframeReady = true;
    if(pendingAutoplay){ ytCmd('playVideo'); pendingAutoplay=false; }
  }

  if(d.event === 'onStateChange'){
    // 1=playing  2=paused  0=ended  3=buffering  5=video cued
    const s = typeof d.info === 'object' ? d.info.playerState : d.info;
    if(s === 1)      setPlaying(true);
    else if(s === 2) setPlaying(false);
    else if(s === 0){ stopTicker(); nextSong(); }
  }

  // Duration / time info arrives here
  if(d.event === 'infoDelivery' && d.info){
    if(d.info.currentTime != null) currentTime    = d.info.currentTime;
    if(d.info.duration    != null) knownDuration  = d.info.duration;
  }
});

/* ── Ticker: smooth local estimate + postMessage poll ── */
function startTicker(){
  stopTicker();
  ticker = setInterval(()=>{
    if(isPlaying) currentTime = Math.min(currentTime + 0.3, knownDuration || SONGS[currentIdx].duration);
    const dur = knownDuration || SONGS[currentIdx].duration;
    const pct = dur ? Math.min(currentTime/dur*100, 100) : 0;
    document.getElementById('tl-fill').style.width  = pct+'%';
    document.getElementById('tl-thumb').style.left  = pct+'%';
    document.getElementById('t-cur').textContent    = fmt(currentTime);
    document.getElementById('t-dur').textContent    = fmt(dur);
  }, 300);
}
function stopTicker(){if(ticker){clearInterval(ticker);ticker=null;}}

function setPlaying(v){
  isPlaying = v;
  document.getElementById('play-btn').textContent = v ? '⏸' : '▶';
  document.getElementById('dot').className = 'dot'+(v?'':' off');
  document.getElementById('vinyl').classList.toggle('playing', v);
  if(v || songLoaded){
    document.getElementById('tonearm').classList.add('on-record');
    document.getElementById('hint').classList.add('hidden');
  }
  v ? startTicker() : stopTicker();
}

function loadSong(idx, autoplay){
  currentIdx=idx; songLoaded=true;
  iframeReady=false; currentTime=0; knownDuration=0;
  pendingAutoplay = !!autoplay;

  const sg = SONGS[idx];
  document.getElementById('song-title').textContent  = sg.title;
  document.getElementById('song-artist').textContent = sg.artist;
  document.getElementById('t-dur').textContent       = fmt(sg.duration);
  document.getElementById('tonearm').classList.add('on-record');
  document.getElementById('hint').classList.add('hidden');
  renderList(); stopTicker(); setPlaying(false);

  /*
    Key: set frame.src directly.
    - youtube-nocookie.com avoids extra tracking cookies
    - enablejsapi=1  → iframe will accept postMessage commands
    - origin param is intentionally omitted so YouTube doesn't
      reject requests from file:// or custom-protocol origins
  */
  frame.src = `https://www.youtube-nocookie.com/embed/${sg.videoId}`
    + `?autoplay=${autoplay?1:0}`
    + `&enablejsapi=1`
    + `&controls=0`
    + `&disablekb=1`
    + `&fs=0`
    + `&modestbranding=1`
    + `&rel=0`
    + `&playsinline=1`;
}

function nextSong(){ loadSong((currentIdx+1) % SONGS.length, true); }
function prevSong(){
  if(currentTime > 3){ currentTime=0; ytCmd('seekTo',[0,true]); return; }
  loadSong((currentIdx-1+SONGS.length) % SONGS.length, isPlaying);
}

function renderList(){
  document.getElementById('song-list').innerHTML = SONGS.map((sg,i)=>`
    <div class="song-item${i===currentIdx&&songLoaded?' active':''}" onclick="selectSong(${i})">
      <span class="song-num">${i===currentIdx&&isPlaying?'♥':i+1}</span>
      <div class="song-info"><div class="s-title">${sg.title}</div><div class="s-artist">${sg.artist}</div></div>
      <span class="s-dur">${fmt(sg.duration)}</span>
    </div>`).join('');
}
window.selectSong = idx => loadSong(idx, true);
renderList();

/* ── Button controls ── */
document.getElementById('play-btn').addEventListener('click', ()=>{
  if(!songLoaded){ loadSong(0, true); return; }
  if(isPlaying){
    ytCmd('pauseVideo');
  } else {
    if(iframeReady) ytCmd('playVideo');
    else pendingAutoplay = true;
  }
});
document.getElementById('next-btn').addEventListener('click', nextSong);
document.getElementById('prev-btn').addEventListener('click', prevSong);
document.getElementById('tonearm').addEventListener('click', ()=>{
  if(!songLoaded) loadSong(0, true);
  else document.getElementById('play-btn').click();
});

/* ── Scrubbing ── */
let scrub=false;
function doScrub(e){
  const r   = document.getElementById('timeline').getBoundingClientRect();
  const px  = e.touches ? e.touches[0].clientX : e.clientX;
  const pct = Math.max(0, Math.min(1, (px-r.left)/r.width));
  const dur = knownDuration || SONGS[currentIdx].duration;
  currentTime = pct * dur;
  ytCmd('seekTo', [currentTime, true]);
}
const tl = document.getElementById('timeline');
tl.addEventListener('mousedown',  e=>{scrub=true; doScrub(e);});
document.addEventListener('mousemove',  e=>{if(scrub) doScrub(e);});
document.addEventListener('mouseup',    ()=>{scrub=false;});
tl.addEventListener('touchstart', e=>{scrub=true; doScrub(e);},{passive:true});
document.addEventListener('touchmove',  e=>{if(scrub) doScrub(e);},{passive:true});
document.addEventListener('touchend',   ()=>{scrub=false;});
</script>
</body>
</html>
